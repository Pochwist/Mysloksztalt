<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Myślokształt — licznik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FBF1E6; /* brzoskwiniowy świt - ciepłe, jasne tło */
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            min-height: 100vh;
        }

        #canvas-tlo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .ui {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            font-weight: 600;
            color: #2F7A6D; /* pastelowa zieleń-błękit zamiast brązu z oryginalnej palety */
            text-shadow: 0 0 25px rgba(79, 158, 146, 0.35);
            margin-bottom: 8px;
        }

        .opis {
            font-size: 1em;
            color: rgba(47, 122, 109, 0.75);
            font-style: italic;
            margin-bottom: 30px;
        }

        /* --- PANEL (ten sam "szklany" styl co na stronie głównej, w cieplejszej, jasnej odmianie) --- */
        .panel {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(224, 144, 74, 0.55);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            box-shadow: 0 0 30px rgba(224, 144, 74, 0.15);
        }

        iframe {
            display: block;
            width: 100%;
            height: 68vh;
            min-height: 420px;
            border: none;
            border-radius: 16px;
            background: #ffffff;
        }

        .fallback {
            margin-top: 18px;
            font-size: 0.9em;
            color: rgba(47, 122, 109, 0.75);
        }

        .fallback a {
            color: #2F7A6D;
            text-decoration: none;
            border-bottom: 1px solid rgba(47, 122, 109, 0.4);
            transition: color 0.3s, border-color 0.3s;
        }

        .fallback a:hover {
            color: #E0904A;
            border-color: rgba(224, 144, 74, 0.6);
        }

        .powrot {
            display: inline-block;
            margin-top: 28px;
            color: rgba(47, 122, 109, 0.8);
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s;
        }

        .powrot:hover {
            color: #E0904A;
        }
    </style>
</head>
<body>

    <canvas id="canvas-tlo"></canvas>

    <div class="ui">
        <h1>Licznik odwiedzin</h1>
        <p class="opis">Statystyki ruchu Myślokształtu</p>

        <div class="panel">
            <iframe
                src="https://lubomir.goatcounter.com?access-token=5l1f6c5s336p1k9255g2x193u6d42462o5gj6z&hideui=1"
                title="Statystyki GoatCounter"
                loading="lazy"></iframe>
        </div>

        <p class="fallback">
            Jeśli panel wyżej się nie wczytał, <a href="https://lubomir.goatcounter.com?access-token=5l1f6c5s336p1k9255g2x193u6d42462o5gj6z" target="_blank" rel="noopener">otwórz statystyki na Goat Counter</a>.
        </p>

        <a href="../" class="powrot">← Powrót na stronę główną</a>
    </div>

    <script>
        // Lekkie, statyczne tło z porozrzucanymi literami (szare, bez interakcji myszy
        // i bez ukrytych triad - to strona narzędziowa, a nie główna, więc ma być jak
        // najlżejsza).
        const canvas = document.getElementById('canvas-tlo');
        const ctx = canvas.getContext('2d');

        const SPACING = 30;
        const znaki = 'abcdefghijklmnopqrstuvwxyząćęłńóśźż0123456789' + ' '.repeat(80);

        const jestDotykowy = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        let cols, rows, siatka = [];

        function losowyZnak() {
            return znaki[Math.floor(Math.random() * znaki.length)];
        }

        function rysujKomorke(x, y) {
            const posX = x * SPACING + SPACING / 2;
            const posY = y * SPACING + SPACING / 2;
            ctx.fillStyle = '#FBF1E6';
            ctx.fillRect(posX - SPACING / 2, posY - SPACING / 2, SPACING, SPACING);
            ctx.fillStyle = 'rgba(90, 90, 90, 0.14)'; // litery tła - szare, bardzo subtelne
            ctx.fillText(siatka[y][x], posX, posY);
        }

        function inicjuj() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / SPACING);
            rows = Math.floor(canvas.height / SPACING);

            siatka = [];
            for (let y = 0; y < rows; y++) {
                const rzad = [];
                for (let x = 0; x < cols; x++) rzad.push(losowyZnak());
                siatka.push(rzad);
            }

            ctx.font = '14px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FBF1E6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) rysujKomorke(x, y);
            }
        }

        window.addEventListener('resize', inicjuj);
        inicjuj();

        // Delikatne, rzadkie "tchnienie życia" w tle - zamiana jednej litery naraz,
        // żeby strona wyglądała żywo bez kosztu pełnego odświeżania całej siatki.
        setInterval(() => {
            const x = Math.floor(Math.random() * cols);
            const y = Math.floor(Math.random() * rows);
            if (siatka[y] && siatka[y][x] !== undefined) {
                siatka[y][x] = losowyZnak();
                rysujKomorke(x, y);
            }
        }, jestDotykowy ? 400 : 180);
    </script>

</body>
</html>
